[package]
name = "subconscious"
version = "0.1.0"
edition = "2024"

[lib]
name = "subconscious"
path = "src/lib.rs"

[[bin]]
name = "subconscious"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = { version = "0.57", default-features = false }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
uuid = { version = "1", features = ["v7"] }
